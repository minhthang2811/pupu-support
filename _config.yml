# GitHub Pages config for the Pupu support site.
#
# Pages builds the root of `main`, so the published URLs are
# https://minhthang2811.github.io/pupu-support/<page>. Apple requires a
# reachable Privacy Policy URL and a Support URL on every App Store listing,
# and this is the cheapest way to own both without running a server. The app's
# own code is in a private repository, which Pages will not serve on a free
# plan — hence this separate public one.
title: Pupu
description: A visual day planner for iPhone.
theme: jekyll-theme-minimal
exclude:
  - README.md
